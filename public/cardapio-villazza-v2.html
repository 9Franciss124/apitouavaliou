<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cardápio · Villazza Slice Shop</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#2b7de9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Poppins:wght@400;500&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#f2ede4; --ink:#6f1d1b; --soft:#8a4a45; --green:#1d4a3f; --line:#6f1d1b; --chk2:#f2ede4;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2a1311;--ink:#f0b9a8;--soft:#c99a8f;--green:#7fc4ae;--line:#a85a50;--chk2:#2a1311}
}
:root[data-theme="dark"]{--bg:#2a1311;--ink:#f0b9a8;--soft:#c99a8f;--green:#7fc4ae;--line:#a85a50;--chk2:#2a1311}
*,*::before,*::after{box-sizing:inherit}
html{height:auto;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.5}
.checker{height:36px;background:conic-gradient(var(--ink) 25%,var(--chk2) 0 50%,var(--ink) 0 75%,var(--chk2) 0) 0 0/36px 36px}
.checker.bottom{height:36px}
header{text-align:center;padding:20px 20px 18px}
.logo{margin:0}
.logo img{display:block;margin:0 auto;width:min(62vw,260px);height:auto}
:root[data-theme="dark"] .logo img{background:#f2ede4;border-radius:14px;padding:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo img{background:#f2ede4;border-radius:14px;padding:12px}}
.tag{font-family:Yellowtail,cursive;font-size:20px;color:var(--ink);margin:14px 0 0}
nav{justify-content:flex-start;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-top:2px solid var(--line);border-bottom:2px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;min-height:40px;display:flex;align-items:center;font-family:"Rozha One",serif;font-size:16px;color:var(--ink);text-decoration:none;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px}
nav a.on{background:var(--ink);color:var(--bg)}
nav a:focus-visible{outline:3px solid var(--green);outline-offset:2px}
main{max-width:480px;margin:0 auto;padding:0 20px 24px}
section{padding-top:36px}
h2{font-family:"Rozha One",serif;font-weight:400;font-size:28px;line-height:1.1;margin:0 0 6px;padding-bottom:12px;border-bottom:3px solid var(--line);text-transform:uppercase}
section.vegan h2{color:var(--green)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin:12px 0 0;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:18px 0;border-bottom:1.5px solid var(--line);align-items:start}
.item h3{font-family:"Rozha One",serif;font-weight:400;font-size:21px;line-height:1.15;margin:0 0 4px}
.item p{margin:0;font-size:14px;color:var(--soft);max-width:34ch}
.prices{display:grid;gap:5px;justify-items:end}
.price{display:flex;align-items:center;gap:8px;font-family:"Rozha One",serif;font-size:15px;white-space:nowrap}
.sz{width:30px;height:30px;border:1.2px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none;font:500 9.5px/1 Poppins,sans-serif;text-align:center;color:var(--ink)}
.sz svg{width:16px;height:16px}
.hint{font-size:12.5px;color:var(--soft);margin:12px 0 0}
.pz{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1.5px solid var(--line);padding:16px 0;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pz:active{opacity:.65}
.pz:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.nm{display:flex;align-items:center;gap:10px}
.t{font-family:"Rozha One",serif;font-size:21px;line-height:1.15}
.chev{flex:none;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;position:relative}
.chev::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translate(-70%,-50%) rotate(-45deg)}
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(440px,100%);max-width:100%;max-height:92dvh;margin:auto auto 0;border-radius:24px 24px 0 0;overflow:auto;position:fixed}
dialog[open]{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(30,8,6,.62)}
@media (min-width:520px){dialog{margin:auto;border-radius:24px}}
.ph{aspect-ratio:4/3;background:#e9dccb;display:grid;place-items:center;overflow:hidden}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block}
.mb{padding:20px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.mb h3{font-family:"Rozha One",serif;font-weight:400;font-size:27px;line-height:1.15;margin:0 0 8px}
.mb p{margin:0;color:var(--soft);font-size:15px;max-width:none}
.mp{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:18px;padding-top:16px;border-top:1.5px solid var(--line)}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.x:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.simple{grid-template-columns:1fr auto;align-items:center}
.simple h3{margin:0;font-size:21px}
.simple .price{font-size:16px}
.note{font-size:12.5px;color:var(--soft);margin:14px 0 0}
footer{text-align:center;padding:24px 20px 40px}
footer p{font-family:Yellowtail,cursive;font-size:22px;margin:0 0 4px}
footer small{color:var(--soft);font-size:12px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  <p class="tag">Na massa, cama de molho de tomate e mozzarella.</p>
</header>

<nav id="nav" aria-label="Seções do cardápio">
  <a href="#pizzas">Pizzas</a>
  <a href="#veganas">Veganas</a>
  <a href="#doces">Doces</a>
  <a href="#acomp">Acompanhamentos</a>
</nav>

<main id="app"></main>

<footer>
  <small>Villazza Slice Shop · Preços sujeitos a alteração</small>
</footer>
<div class="checker bottom" aria-hidden="true"></div>

<dialog id="dlg" aria-labelledby="dn">
  <button type="button" class="x" id="dx" aria-label="Fechar">&times;</button>
  <div class="ph" id="dph"></div>
  <div class="mb"><h3 id="dn"></h3><p id="dd"></p><div class="mp" id="dp"></div></div>
</dialog>
<script>
const slice='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5 17 3.5 11 17.5 9 11.5z"/></svg>';
const P=(a,b,c)=>({m:a,g:b,f:c});
const sections=[
 {id:'pizzas',title:'Pizzas',legend:true,items:[
  ['Pepperoni','molho de tomate pelati, mozzarella, pepperoni, champignon fresco, azeitona preta e cebola.',P(94,146,18)],
  ['Calabresa acebolada','molho de tomate pelati, mozzarella, calabresa e cebola.',P(86,130,16)],
  ['Portuguesa','molho de tomate pelati, mozzarella, calabresa, presunto, ovo, azeitona preta, pimentão e cebola.',P(94,146,18)],
  ['3 queijos','molho de tomate pelati, mozzarella, gorgonzola e requeijão.',P(89,138,17)],
  ['Frango com requeijão','molho de tomate pelati, mozzarella, frango com requeijão cremoso da fazenda.',P(86,130,15)],
  ['Milho e bacon','molho de tomate pelati, mozzarella, milho e bacon com perfume de limão siciliano.',P(86,130,16)],
  ['Mozzarella','molho de tomate pelati, mozzarella e manjericão.',P(79,124,14)],
  ['Fugazzeta','Pizza estilo torta com molho de tomate pelati, mozzarella, cebola e chimichurri.',P(null,null,20)],
  ['Frango crocante com creme de milho','molho de tomate pelati, mozzarella com frango crocante com creme de milho, finalizado com barbecue e molho ranch.',P(86,130,16)]
 ]},
 {id:'veganas',title:'Pizzas veganas',cls:'vegan',items:[
  ['Abobrinha no Missô com Cogumelos','Creme de queijo vegano e abobrinha no missô com cogumelos.',P(94,146,18)],
  ['Alho crocante e milho','Creme de queijo vegano, alho crocante e milho.',P(94,146,18)]
 ]},
 {id:'doces',title:'Pizzas doces',items:[
  ['Banoffe','Mozzarella, banana, canela e açúcar.',P(86,130,16)],
  ['Chocolate','Mozzarella e chocolate ao leite.',P(86,130,16)],
  ['Doce de leite','mozzarella, doce de leite, finalizada com Parmesão ralado.',P(86,130,16)],
  ['Pistache','Creme de pistache, parmesão maturado e raspa de limão siciliano.',P(86,130,17)]
 ]},
 {id:'acomp',title:'Acompanhamentos',simple:true,items:[
  ['Ketchup fermentado no missô','',5],['Molho ranch','',6],['Mel picante','',7],['Molho de tomate da casa','',4],
  ['Pesto','',7],['Chocolate','',5],['Doce de leite','',5],['Nuvem de Parmesão','',5]
 ]}
];
const fmt=n=>'R$ '+n.toFixed(2).replace('.',',');
const price=(l,v)=>`<div class="price"><span class="sz">${l}</span>${fmt(v)}</div>`;
document.getElementById('app').innerHTML=sections.map((s,si)=>{
  const legend=s.legend?`<div class="legend"><span><i class="sz">35<br>cm</i> média</span><span><i class="sz">50<br>cm</i> grande</span><span><i class="sz">${slice}</i> fatia</span></div>`:'';
  const items=s.items.map(([n,d,p],ii)=>{
    if(s.simple) return `<div class="item simple"><h3>${n}</h3><div class="price">${fmt(p)}</div></div>`;
    const rows=[p.m!=null?price('35<br>cm',p.m):'',p.g!=null?price('50<br>cm',p.g):'',price(slice,p.f)].join('');
    return `<button type="button" class="pz" data-s="${si}" data-i="${ii}"><div class="nm"><span class="t">${n}</span><span class="chev" aria-hidden="true"></span></div><div class="prices">${rows}</div></button>`;
  }).join('');
  return `<section id="${s.id}" class="${s.cls||''}"><h2>${s.title}</h2>${s.simple?'':'<p class="hint">Toque em uma pizza para ver foto e ingredientes.</p>'}${legend}${items}</section>`;
}).join('');

// Fotos: coloque o caminho/data-URI da foto pelo nome da pizza. Ex.: photos['Pepperoni']='data:image/jpeg;base64,...'
const photos={};
const placeholder='<svg viewBox="0 0 200 150" role="img" aria-label="Foto em breve"><rect width="200" height="150" fill="#e9dccb"/><circle cx="100" cy="68" r="46" fill="#e2a95a" stroke="#6f1d1b" stroke-width="3"/><circle cx="100" cy="68" r="36" fill="#b53a2b"/><circle cx="100" cy="68" r="31" fill="#f4e3b8" opacity=".85"/><g fill="#8e2a22"><circle cx="86" cy="58" r="6"/><circle cx="112" cy="62" r="6"/><circle cx="98" cy="82" r="6"/><circle cx="118" cy="82" r="4"/><circle cx="82" cy="78" r="4"/></g><text x="100" y="138" text-anchor="middle" font-family="Yellowtail,cursive" font-size="16" fill="#6f1d1b">foto em breve</text></svg>';
const dlg=document.getElementById('dlg');
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('.pz'); if(!b) return;
  const it=sections[b.dataset.s].items[b.dataset.i], [n,d,p]=it;
  document.getElementById('dph').innerHTML=photos[n]?`<img src="${photos[n]}" alt="Pizza ${n}">`:placeholder;
  document.getElementById('dn').textContent=n;
  document.getElementById('dd').textContent=d.charAt(0).toUpperCase()+d.slice(1);
  document.getElementById('dp').innerHTML=[p.m!=null?price('35<br>cm',p.m):'',p.g!=null?price('50<br>cm',p.g):'',price(slice,p.f)].join('');
  dlg.showModal(); dlg.scrollTop=0;
});
document.getElementById('dx').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

// destaca a aba da seção visível
const links=[...document.querySelectorAll('#nav a')];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));const on=document.querySelector('#nav a.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}})},{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
</script>
</body>
</html>
