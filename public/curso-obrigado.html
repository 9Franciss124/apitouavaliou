<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Acesso ao curso | Apitou Avaliou</title><link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap">
<style>:root{color-scheme:light}body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#fff;color:#1b2230;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:64px 20px}h1{font-family:Poppins,sans-serif;font-weight:800;font-size:2rem;line-height:1.15;margin:0 0 12px}
p{color:#5b6678;margin:0 0 14px}.box{border:1px solid #dde6f3;border-radius:18px;padding:22px;margin:24px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#2b7de9;color:#fff;text-decoration:none;font-family:Poppins,sans-serif;font-weight:600;padding:15px 26px;border-radius:999px;border:0;font-size:1rem;cursor:pointer}
.btn.wa{background:#25a244}.btn.ghost{background:#fff;color:#2b7de9;border:2px solid #2b7de9}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.ok{color:#1d7a3a}.ico{font-size:2.2rem}</style></head><body><main>
<div class="ico" id="i">⏳</div><h1 id="t">Confirmando seu pagamento…</h1><p id="s">Aguarde alguns segundos.</p>
<div class="box" id="b" hidden><p id="bt" style="margin:0 0 12px"></p><div class="row" id="r"></div></div>
<script>
var WA="5585997307346",ref=new URLSearchParams(location.search).get('ref')||'',tries=0,timer;
var $=function(i){return document.getElementById(i)};
function wa(m){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(m)}
function show(i,t,s,bt,btns){$('i').textContent=i;$('t').textContent=t;$('s').textContent=s;$('bt').textContent=bt||'';$('b').hidden=!bt;$('r').innerHTML='';(btns||[]).forEach(function(x){var a=document.createElement(x.href?'a':'button');a.className='btn '+(x.cls||'');a.textContent=x.txt;if(x.href){a.href=x.href;a.rel='noopener'}if(x.on)a.onclick=x.on;$('r').appendChild(a)})}
function check(){
 if(!ref){show('⚠️','Não encontramos seu pagamento','Abra esta página pelo link que o Mercado Pago mostrou ao final da compra.','Se você já pagou, envie o comprovante no WhatsApp que a gente te coloca no grupo.',[{txt:'Enviar comprovante no WhatsApp',cls:'wa',href:wa('Olá! Paguei o curso de revenda de placas NFC e quero entrar no grupo.')}]);return}
 fetch('/api/curso?ref='+encodeURIComponent(ref)).then(function(r){return r.json()}).then(function(d){
  if(d.ok&&d.status==='approved'){
   clearTimeout(timer);
   if(d.url)show('✅','Pagamento confirmado!','Falta só um passo: entre no grupo do WhatsApp, onde o curso é passado.','Toque no botão abaixo para entrar no grupo.',[{txt:'Entrar no grupo do WhatsApp',cls:'wa',href:d.url}]);
   else show('✅','Pagamento confirmado!','Chame a gente no WhatsApp para entrar no grupo do curso.','Envie uma mensagem e te adicionamos ao grupo.',[{txt:'Chamar no WhatsApp',cls:'wa',href:wa('Olá! Paguei o curso de revenda de placas NFC (código '+ref+') e quero entrar no grupo.')}]);
   return}
  if(d.status==='pending'&&tries<24){tries++;show('⏳','Pagamento em análise','Se você pagou por Pix, a confirmação costuma levar poucos segundos. Esta página atualiza sozinha.','Já pagou e demorou? Mande o comprovante para a gente.',[{txt:'Verificar de novo',cls:'ghost',on:function(){tries=0;check()}},{txt:'Enviar comprovante',cls:'wa',href:wa('Olá! Paguei o curso (código '+ref+') e estou aguardando a confirmação.')}]);timer=setTimeout(check,5000);return}
  show('ℹ️','Ainda não vimos o pagamento','Se você já pagou, pode levar alguns minutos para confirmar.','Envie o comprovante no WhatsApp e a gente te coloca no grupo.',[{txt:'Verificar de novo',cls:'ghost',on:function(){tries=0;check()}},{txt:'Enviar comprovante',cls:'wa',href:wa('Olá! Paguei o curso (código '+ref+') e quero entrar no grupo.')}])
 }).catch(function(){show('ℹ️','Não conseguimos confirmar agora','Tente de novo em instantes.','Se você já pagou, envie o comprovante no WhatsApp.',[{txt:'Verificar de novo',cls:'ghost',on:function(){tries=0;check()}},{txt:'Enviar comprovante',cls:'wa',href:wa('Olá! Paguei o curso (código '+ref+') e quero entrar no grupo.')}])})
}
check();
</script></main></body></html>
